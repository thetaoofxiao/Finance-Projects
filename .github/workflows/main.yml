name: attention-radar

# Lives at .github/workflows/attention-radar.yml in the repo root.
# The engine files live in the attention-radar/ folder.

on:
  schedule:
    - cron: "15 10 * * 1"   # Mondays 10:15 UTC, before the Claude edition run
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the run save data/ back into the repo

concurrency:
  group: attention-radar
  cancel-in-progress: false

defaults:
  run:
    working-directory: attention-radar

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: attention-radar/requirements.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          RADAR_UA: ${{ secrets.RADAR_UA }}
        run: python radar.py

      - name: Save results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "radar run $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
